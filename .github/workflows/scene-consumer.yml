name: Scene consumer core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install native system SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Run actual C# coordinate and JSON tests (not Unity Editor)
        run: dotnet run --project apps/unity-client/Tests/ConsumerTests.csproj -- apps/unity-client/Assets/StreamingAssets/two-bedroom.json
      - name: Run authoritative offline validation and real SQLite transactions
        run: dotnet run --project apps/unity-client/Tests/OfflineTests.csproj -- apps/unity-client/Assets/StreamingAssets/scene.schema.json apps/unity-client/Tests/Fixtures/offline-validation.json apps/unity-client/Assets/StreamingAssets/two-bedroom.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative sample and offline fixture drift
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python tools/export_unity_sample.py --check
          python tools/export_offline_validation.py --check
