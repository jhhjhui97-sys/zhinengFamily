name: Scene consumer core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run actual C# coordinate and JSON tests (not Unity Editor)
        run: dotnet run --project apps/unity-client/Tests/ConsumerTests.csproj -- apps/unity-client/Assets/StreamingAssets/two-bedroom.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative sample
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python tools/export_unity_sample.py --check
