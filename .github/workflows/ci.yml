name: Phase 1 backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smart_home
          POSTGRES_PASSWORD: ci-ephemeral-postgres-only
          POSTGRES_DB: smart_home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_home -d smart_home_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smart_home:ci-ephemeral-postgres-only@localhost:5432/smart_home_dev
      TEST_DATABASE_URL: postgresql+psycopg://smart_home:ci-ephemeral-postgres-only@localhost:5432/smart_home_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Generate ephemeral signing key
        run: python -c 'import secrets; print("SECRET_KEY=" + secrets.token_hex(32))' >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Migrate test database
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Tests and generated contracts
        run: |
          python -m pytest -v
          python -m scene_schema.export --check
          python packages/api-contracts/export.py --check
      - name: Validate Docker build
        env:
          POSTGRES_PASSWORD: ci-ephemeral-postgres-only
        run: |
          docker compose config --quiet
          docker compose build api
