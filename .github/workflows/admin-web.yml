name: Phase 2-1 admin web
on:
  push:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web.yml'
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_PRODUCTION: '1'
