[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-schema"
version = "1.0.0"
description = "Versioned millimeter SceneModel exchange contract"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
